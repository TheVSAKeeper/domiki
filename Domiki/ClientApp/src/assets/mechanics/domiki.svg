  <rect x="34" y="30" width="20" height="24" fill="#b07c42"/>
  <rect x="36" y="32" width="10" height="10" fill="#262626"/>
  <rect x="38" y="34" width="6" height="6" fill="#4a7ab5" class="asset-accent"/>
  <rect x="42" y="44" width="10" height="10" fill="#262626"/>
