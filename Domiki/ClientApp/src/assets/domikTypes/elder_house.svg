<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges" data-size="128" data-level="1" data-working="false" data-active="true" data-state="idle" data-motion="on" role="img" aria-labelledby="elder_house-title elder_house-desc" focusable="false" preserveAspectRatio="xMidYMid meet" color-interpolation="sRGB"><title id="elder_house-title">Изба старосты</title><desc id="elder_house-desc">Скромная изба с лавкой под окном: на лавке счёты и раскрытая счётная книга, над дверью полка с бирками. Три уровня: база, мерная рейка с колышками, заповедный ларь с золотой меткой.</desc><style>
